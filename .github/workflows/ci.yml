name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run pack:check
      - if: runner.os == 'Linux'
        run: bash scripts/version-sync.sh

  # A repo made from the template must run scripts/init.sh first.
  placeholders:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          if git grep -nE 'template-node-package|template_node_package|TEMPLATE_NODE_PACKAGE|__DESCRIPTION__'; then
            echo "::error::template placeholders remain; run scripts/init.sh <name> \"<description>\""
            exit 1
          fi
